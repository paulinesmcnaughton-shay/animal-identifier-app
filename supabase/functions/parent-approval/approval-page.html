<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WildKind — Parent Approval</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #FFF8E7;
      transition: background 0.3s;
    }
    body.green { background: #1a3d2b; }
    body.red   { background: #fee2e2; }
    body.amber { background: #FFF8E7; }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(21,33,48,0.18);
    }
    .logo-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo-leaf {
      width: 40px; height: 40px;
      background: #1a3d2b;
      border-radius: 50% 50% 50% 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-leaf svg { width: 22px; height: 22px; }
    .logo-name { font-size: 24px; font-weight: 800; color: #152130; letter-spacing: -0.4px; }
    .icon { font-size: 56px; margin-bottom: 20px; line-height: 1; }
    h1 { color: #152130; font-size: 26px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.4px; }
    .explorer {
      display: inline-block;
      background: #F0FAF3;
      border-radius: 999px;
      padding: 6px 18px;
      font-size: 15px;
      font-weight: 700;
      color: #1a3d2b;
      margin: 12px 0 16px;
    }
    .explorer .handle { font-weight: 400; color: #7388A0; margin-left: 6px; font-size: 13px; }
    .sub { color: #33455A; font-size: 16px; line-height: 26px; margin-bottom: 8px; }
    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 8px 24px;
      font-size: 14px;
      font-weight: 700;
      margin: 16px 0 20px;
      letter-spacing: 0.3px;
    }
    .badge.approved { background: #1a3d2b; color: #fff; }
    .badge.declined { background: #fee2e2; color: #dc2626; }
    .badge.pending  { background: #fef3c7; color: #92400e; }
    .badge.expired  { background: #fee2e2; color: #dc2626; }
    .divider { height: 1px; background: #E7EDF3; margin: 24px 0; }
    .footer { color: #7388A0; font-size: 13px; line-height: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-bar">
      <div class="logo-leaf">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 3C6 3 3 6 3 10c0 2.5 1.5 4.5 3.5 5.5L10 17l3.5-1.5C15.5 14.5 17 12.5 17 10c0-4-3-7-7-7z" fill="#52b788"/>
          <path d="M10 7v6M7 10h6" stroke="#1a3d2b" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="logo-name">WildKind</span>
    </div>
    <div id="content"></div>
    <div class="divider"></div>
    <p class="footer">You can close this window.</p>
  </div>

  <script>
    const p = new URLSearchParams(location.search)
    const status   = p.get('status') || 'invalid'
    const name     = p.get('name')   || ''
    const username = p.get('username') || ''

    const explorerHtml = (name || username)
      ? `<div class="explorer">${name || username}${name && username ? `<span class="handle">@${username}</span>` : ''}</div>`
      : ''

    const states = {
      approved: {
        bg: 'green',
        icon: '🌿',
        heading: 'Thank you for keeping WildKind safe!',
        badge: '<span class="badge approved">Access Approved ✓</span>',
        body: `You've approved your child's WildKind account. They can now start exploring nature, identifying animals, and building their wild collection.<br><br>You can manage their privacy settings and permissions anytime from within the app.`,
      },
      declined: {
        bg: 'red',
        icon: '❌',
        heading: 'Request Declined',
        badge: '<span class="badge declined">Access Declined</span>',
        body: "You've declined the WildKind access request. Your child's account will not be activated.",
      },
      'not-ready': {
        bg: 'amber',
        icon: '⏳',
        heading: 'Not Ready Yet',
        badge: '<span class="badge pending">Setup Incomplete</span>',
        body: "Your child hasn't finished setting up their WildKind profile yet.<br><br>Once they complete their account setup, ask them to send you a new approval request from inside the app. You'll receive a fresh email with a working link.",
      },
      expired: {
        bg: 'amber',
        icon: '⏰',
        heading: 'Link Expired',
        badge: '<span class="badge expired">Expired</span>',
        body: 'This approval link has expired. Please ask your child to send a new permission request from the WildKind app.',
      },
      'already-approved': {
        bg: 'green',
        icon: '✅',
        heading: 'Already Approved',
        badge: '<span class="badge approved">Access Approved</span>',
        body: 'This request has already been approved.',
      },
      'already-declined': {
        bg: 'red',
        icon: '❌',
        heading: 'Already Declined',
        badge: '<span class="badge declined">Access Declined</span>',
        body: 'This request has already been declined.',
      },
      invalid: {
        bg: 'amber',
        icon: '⚠️',
        heading: 'Invalid Link',
        badge: '<span class="badge expired">Error</span>',
        body: 'This approval link is invalid or malformed. Please check your email for the correct link.',
      },
    }

    const s = states[status] || states.invalid
    document.body.classList.add(s.bg)
    document.getElementById('content').innerHTML = `
      <div class="icon">${s.icon}</div>
      <h1>${s.heading}</h1>
      ${explorerHtml}
      ${s.badge}
      <p class="sub">${s.body}</p>
    `
  </script>
</body>
</html>
